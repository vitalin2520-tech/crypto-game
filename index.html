<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Tycoon</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .counter {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .coin-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: none;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            font-size: 70px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(243, 156, 18, 0.4);
            transition: transform 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .coin-btn:active {
            transform: scale(0.90);
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.3);
        }
        .info {
            margin-top: 40px;
            font-size: 15px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="counter" id="score">0 COINS</div>
    
    <button class="coin-btn" id="tapBtn">🪙</button>
    
    <div class="info">Тапай по монете, чтобы майнить!</div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на полный экран

        let score = 0;
        const scoreElement = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');

        tapBtn.addEventListener('click', () => {
            score += 1;
            scoreElement.innerText = score + " COINS";
            
            // Легкая вибрация при клике на телефоне
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
